<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مواعيدي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14302e;--mute:#5d7471;--line:#d3dedc;--acc:#0f766e;--gold:#e3b04b;--warn:#b45309;--on:#14302e;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--card:#162726;--ink:#e6f0ee;--mute:#93aca8;--line:#26403d;--acc:#4fd1c5;--warn:#f59e0b;--onacc:#06201d}}
:root[data-theme="dark"]{--bg:#0e1a19;--card:#162726;--ink:#e6f0ee;--mute:#93aca8;--line:#26403d;--acc:#4fd1c5;--warn:#f59e0b;--onacc:#06201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:2rem;font-weight:800}
h2{margin:0 0 8px;font-size:1.15rem;font-weight:800}
p{margin:4px 0}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row b{font-weight:600;color:var(--acc);white-space:nowrap}
input[type=time],input[type=date],input[type=datetime-local],input[type=text]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=text]{flex:1}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.big{width:100%;padding:12px;margin-top:8px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.add{display:flex;gap:8px;margin-top:8px}
.x{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:8px;padding:2px 10px;cursor:pointer;white-space:nowrap}
.ev{display:flex;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line)}
.ev time{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4em}
.ck{width:24px;flex:none;text-align:center}
.tx{flex:1}
.ev small{display:block;color:var(--mute)}
.ev.past{opacity:.5}
.ev.miss .tx{color:var(--warn);font-weight:600}
.ev.next{background:var(--acc);color:var(--onacc);border-radius:10px;padding:12px;border:0;margin:6px 0}
.ev.next time{font-size:1.5rem}
.ev.next small{color:inherit;opacity:.85}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:start;color:var(--mute);font-weight:600;font-size:.85rem;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .tm{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800}
.tbl small{display:block;color:var(--mute);font-weight:400}
.tbl tr.past td{opacity:.5}
.tbl tr.miss td.tx{color:var(--warn);font-weight:600}
.tbl tr.next td{background:var(--acc);color:var(--onacc);font-weight:800}
.tbl tr.next small{color:inherit;opacity:.85}
.tbl tr.next .x{color:var(--ink)}
#app{padding-bottom:96px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:.75rem;font-weight:600;padding:2px 0}
#nav a span{display:block;font-size:1.3rem;line-height:1.3}
#nav a.on{color:var(--acc)}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:600}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:10;display:grid;gap:8px}
.toast{background:var(--gold);color:var(--on);border-radius:12px;padding:14px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.25);cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h3{margin:16px 0 6px;font-size:.92rem;font-weight:600;color:var(--mute)}
:root{--ok:#15803d;--okbg:#e3f4e8;--wbg:#fdf0dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#4ade80;--okbg:#17352a;--wbg:#3a2a12}}
:root[data-theme="dark"]{--ok:#4ade80;--okbg:#17352a;--wbg:#3a2a12}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(20,48,46,.06),0 8px 24px rgba(20,48,46,.05)}
.scroll{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{font-size:.93rem}
.tbl thead th{background:color-mix(in srgb,var(--ink) 5%,var(--card));color:var(--mute);font-size:.78rem;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 2.5%,var(--card))}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.tbl tbody tr.miss td{background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.tbl tbody tr.next td{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--ink);font-weight:600}
.tbl tbody tr.next td:first-child{box-shadow:inset -4px 0 0 var(--acc)}
.tbl tr.next small{color:var(--mute);opacity:1}
.tbl tr.next .x{color:inherit}
.tbl .tm{font-weight:600;color:var(--ink)}
.tbl .num{text-align:center;font-variant-numeric:tabular-nums}
.tbl .ck{width:44px;text-align:center}
.tbl .x{margin-inline-start:8px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc)}
.pill.off{background:color-mix(in srgb,var(--mute) 16%,var(--card));color:var(--mute)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--wbg);color:var(--warn)}
.pb{font:inherit;font-size:.9rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;padding:3px 14px;cursor:pointer}
.bar{height:8px;min-width:70px;border-radius:99px;background:color-mix(in srgb,var(--mute) 20%,var(--card));overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.lg{height:10px;margin:6px 0 12px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid var(--mute);border-radius:7px;display:inline-grid;place-content:center;cursor:pointer;background:var(--card)}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--onacc);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
#app .seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;font:inherit;font-weight:600;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mute);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ad{padding:12px 0;border-bottom:1px solid var(--line)}
.ad:last-child{border-bottom:0}
.ad.fin{opacity:.55}
.adh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.adt{font-size:1.2rem;line-height:2.1;margin:8px 0;white-space:pre-line}
.ad .add .big{margin:0;flex:1}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<nav id="nav" aria-label="الصفحات"></nav>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),MIN=60000;
const ls={get(k,d){try{const v=localStorage.getItem('mw_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
set(k,v){try{localStorage.setItem('mw_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const COURSES=[['BSP 501',0,14,16,'بي إس بي خمسمائة وواحد'],['BAS 401',1,10,12,'بي إي إس أربعمائة وواحد'],
['BEC 401',1,18,20,'بي إي سي أربعمائة وواحد'],['BPG 401',2,10,12,'بي بي جي أربعمائة وواحد'],
['BPH 401',3,10,12,'بي بي إتش أربعمائة وواحد'],['BNA 401',4,14,16,'بي إن إي أربعمائة وواحد'],
['BPG 402',6,14,16,'بي بي جي أربعمائة واثنان']];
const CATS=[['LECTURE','المحاضرات'],['STUDY','تذكير الدراسة (5 و7)'],['TYPING','تعلم الكتابة'],['QURAN','ورد القرآن'],
['CUSTOM','مهامي التي أضفتها'],['WEEK','تذكير تقصير الأسبوع'],['MORNING','أذكار الصباح'],['EVENING','أذكار المساء'],['DHIKR','اذكر الله كل ساعة']];
const MODES=['🔔 منبه ناطق','📩 إشعار فقط','⛔ متوقف'],MS=['🔔 منبه','📩 إشعار','⛔ متوقف'];
const SEED=['2026-10-25T20:00Z','2026-11-01T15:15Z','2026-11-04T17:45Z','2026-11-07T20:00Z','2026-11-21T20:00Z',
'2026-11-24T20:00Z','2026-11-29T19:00Z','2026-12-06T19:00Z','2026-12-09T20:00Z','2026-12-13T19:00Z',
'2026-12-20T19:00Z','2027-01-03T19:00Z','2027-01-10T19:00Z','2027-01-19T20:00Z','2027-01-27T20:00Z'].map(x=>Date.parse(x));

const at=(d,m)=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,m);
let cfg=Object.assign({modes:{},morning:'06:30',evening:'17:30',sleepS:'00:00',sleepE:'06:00',weekEnd:'20:00',weekStart:'08:00'},ls.get('cfg',{}));
let matches=ls.get('matches',SEED),log=ls.get('log',{}),tasks=ls.get('tasks',[]),active=false,actx=null,wl=null;
let start=ls.get('start',null);if(!start){start=+at(new Date(),0);ls.set('start',start)}
const save=()=>{ls.set('cfg',cfg);ls.set('matches',matches);ls.set('log',log);ls.set('tasks',tasks)};
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isDone=(ds,k)=>!!(log[ds]&&log[ds][k]);
const mode=k=>cfg.modes[k]??(['MORNING','EVENING','DHIKR','WEEK'].includes(k)?1:0);
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const sleeping=h=>{const s=mins(cfg.sleepS),e=mins(cfg.sleepE),m=h*60;return s===e?false:s<e?(m>=s&&m<e):(m>=s||m<e)};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const fmt=d=>AR[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'  '+hm(d);

const clash=(s,k)=>+s<k+140*MIN&&+s+35*MIN>k-10*MIN;
function blockStart(d){
  const def=at(d,22*60+50),ms=[...matches].sort((a,b)=>a-b),hit=ms.find(k=>clash(def,k));
  if(hit==null)return def;
  const after=new Date(hit+140*MIN);
  if(+after+35*MIN<=+at(d,1440)&&!ms.some(k=>k!==hit&&clash(after,k)))return after;
  return new Date(hit-45*MIN);
}
function events(d){
  const ev=[],day=d.getDay(),ds=dstr(d);
  for(const [code,wd,s,e,sp] of COURSES)if(wd===day){
    ev.push({k:'LECTURE',key:'L'+code,t:at(d,s*60-30),text:'لديك محاضرة '+code+' بعد نصف ساعة',say:'لديك محاضرة '+sp+' بعد نصف ساعة'});
    ev.push({k:'STUDYTASK',key:'X'+code,dk:'S'+code,task:true,nofire:true,t:at(d,e*60),text:'ادرس '+code});
    if(s<17)for(const h of [17,19])ev.push({k:'STUDY',key:'S'+code+h,dk:'S'+code,t:at(d,h*60),text:'لم تدرس '+code+' بعد. ادرسها ثم ضع ✓',say:'لم تدرس '+sp+' بعد'});
  }
  const b=blockStart(d),note=+b!==+at(d,22*60+50)?'⚽ رُتّب حول مباراة ريال مدريد':'';
  ev.push({k:'TYPING',key:'T',dk:'T',task:true,t:b,note,text:'تعلم الكتابة على لوحة المفاتيح ⌨️',say:'حان وقت تعلم الكتابة على لوحة المفاتيح'});
  ev.push({k:'QURAN',key:'Q',dk:'Q',task:true,t:new Date(+b+20*MIN),note,text:'ورد القرآن 📖',say:'حان وقت وردك من القرآن'});
  ev.push({k:'MORNING',key:'M',dk:'M',task:true,t:at(d,mins(cfg.morning)),text:'أذكار الصباح 🌅',say:'حان وقت أذكار الصباح'});
  ev.push({k:'EVENING',key:'E',dk:'E',task:true,t:at(d,mins(cfg.evening)),text:'أذكار المساء 🌇',say:'حان وقت أذكار المساء'});
  if(day===4)ev.push({k:'WEEK',key:'WE',wtype:'end',t:at(d,mins(cfg.weekEnd)),text:'',say:''});
  if(day===6)ev.push({k:'WEEK',key:'WS',wtype:'start',t:at(d,mins(cfg.weekStart)),text:'',say:''});
  for(const t of tasks){
    const on=t.wd?(String(day) in t.wd&&ds>=t.date):(t.date===ds||(t.rep&&ds>=t.date));
    if(!on)continue;
    const tm=t.wd?t.wd[day]:t.time,nt=!tm;
    ev.push({k:'CUSTOM',key:'U'+t.id,dk:'U'+t.id,task:true,custom:true,id:t.id,rep:t.rep||!!t.wd,wk:!!t.wd,moved:t.moved&&!t.rep&&!t.wd,
      nofire:nt,notime:nt,t:at(d,nt?1439:mins(tm)),text:t.title,say:t.title});
  }
  for(let h=0;h<24;h++)if(!sleeping(h))ev.push({k:'DHIKR',key:'D'+h,t:at(d,h*60),text:'اذكر الله 🤍 سبحان الله وبحمده',say:'اذكر الله'});
  return ev.sort((a,b)=>a.t-b.t);
}

function speak(t){
  if(!('speechSynthesis' in window))return;
  const mk=()=>{const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;return u};
  speechSynthesis.cancel();speechSynthesis.speak(mk());speechSynthesis.speak(mk());
}
function beep(){
  if(!actx)return;
  [0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.25;
    o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)});
}
let swReg=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{swReg=r}).catch(()=>{});
function toast(t,auto){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toasts').appendChild(d);if(auto)setTimeout(()=>d.remove(),2500)}
function weekMiss(type){
  const now=new Date(),sun=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getDay()+1)%7);
  const from=type==='start'?new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()-7):sun,out=[];
  for(let i=0;i<7;i++){
    const d=new Date(from.getFullYear(),from.getMonth(),from.getDate()+i);
    if(+at(d,0)<start||+at(d,0)>+now)continue;
    const ds=dstr(d);
    for(const e of events(d))if(e.task&&!isDone(ds,e.dk)&&!e.moved&&e.t<=now)out.push({d,e});
  }
  return out;
}
function fire(e){
  const m=mode(e.k);if(m===2||e.nofire)return;
  if(e.k==='WEEK'){
    const n=weekMiss(e.wtype).length;if(!n)return;
    const w=e.wtype==='end'?'هذا الأسبوع':'الأسبوع الماضي';
    e.text='⚠️ فاتك '+w+' '+n+' من المهام. راجع صفحة السجل.';e.say='فاتك '+w+' '+n+' من المهام. راجع صفحة السجل.';
  }
  if(e.dk&&isDone(dstr(new Date()),e.dk))return;
  toast(e.text);
  try{if(Notification.permission==='granted'){if(swReg&&swReg.showNotification)swReg.showNotification('مواعيدي',{body:e.text,icon:'icon-192.png',vibrate:[200,100,200]});else new Notification('مواعيدي',{body:e.text})}}catch(x){}
  if(m===0){beep();speak(e.say)}
}
function tick(){
  const now=new Date(),ds=dstr(now);let f=ls.get('fired',{}),ch=false;
  if(f.d!==ds)f={d:ds,k:{}};
  for(const e of events(now))if(!e.nofire&&e.t<=now&&now-e.t<120000&&!f.k[e.key]){f.k[e.key]=1;ch=true;fire(e)}
  if(ch)ls.set('fired',f);
}
async function enable(){
  try{actx=new (window.AudioContext||window.webkitAudioContext)();await actx.resume()}catch(e){}
  try{await Notification.requestPermission()}catch(e){}
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  active=true;speak('تم تفعيل المنبهات');render();
}
document.addEventListener('visibilitychange',async()=>{
  if(active&&document.visibilityState==='visible'){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
});

function renderToday(){
  if(!$('#today'))return;
  const now=new Date(),ds=dstr(now),all=events(now).filter(e=>e.k!=='DHIKR'&&e.k!=='STUDY'&&e.k!=='WEEK');
  const tk=all.filter(e=>e.task),n=tk.filter(e=>isDone(ds,e.dk)).length;
  const nx=all.find(e=>e.t>now&&!(e.task&&isDone(ds,e.dk)));
  $('#today').innerHTML=`<p class="mute">${AR[now.getDay()]} ${now.getDate()}/${now.getMonth()+1} — أنجزت ${n} من ${tk.length} مهام.</p><div class="bar lg"><i style="width:${tk.length?Math.round(n*100/tk.length):0}%"></i></div>`
  +`<div class="scroll"><table class="tbl"><thead><tr><th>✓</th><th>الوقت</th><th>المهمة</th><th>تنبيه</th></tr></thead><tbody>`
  +all.map(e=>{
    const dn=e.task&&isDone(ds,e.dk),ic=e.nofire?'':`<span class="pill ${mode(e.k)===2?'off':''}">${MS[mode(e.k)]}</span>`;
    return `<tr class="${e===nx?'next':(dn||(e.t<=now&&!e.task))?'past':''}"><td class="ck">${e.task?`<input type="checkbox" data-a="tick" data-dk="${e.dk}" ${dn?'checked':''}>`:''}</td><td class="tm">${e.notime?'—':hm(e.t)}</td><td class="tx">${esc(e.text)}${e.note||e.rep?`<small>${e.note||''}${e.rep?(e.wk?' 🔁 أسبوعيًا':' 🔁 كل يوم'):''}</small>`:''}${(e.k==='MORNING'||e.k==='EVENING')?`<button class="x" data-a="openA" data-p="${e.k==='MORNING'?'am':'pm'}">افتح الأذكار</button>`:''}${e.custom?`<button class="x" data-a="delt" data-id="${e.id}">حذف</button>`:''}</td><td>${ic}</td></tr>`;
  }).join('')+`</tbody></table></div>`
  +`<p class="mute">اذكر الله: ${MODES[mode('DHIKR')]}، كل ساعة عدا من ${cfg.sleepS} إلى ${cfg.sleepE}.</p>`;
}
function dayInfo(d){const ds=dstr(d),ts=events(d).filter(e=>e.task);return{d,ds,ts,miss:ts.filter(e=>!isDone(ds,e.dk)&&!e.moved)}}
function pastDays(n){
  const now=new Date(),r=[];
  for(let i=1;i<=n;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);if(+at(d,0)<start)break;r.push(dayInfo(d))}
  return r;
}

function weekTable(sun){

[29,'التسبيح والدعاء','دعاء يونس عليه السلام (دون عدد محدد)',`لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ.`,1,'both'],
[30,'التسبيح والدعاء','أستغفر الله وأتوب إليه (دون عدد محدد)',`أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.`,1,'both']
];
let per=new Date().getHours()<15?'am':'pm';
const ACOUNT=(ds,a)=>(log[ds]&&log[ds]['A'+per+a[0]])||0;
function adhkarHtml(){
  const ds=dstr(new Date()),L=ADHKAR.filter(a=>a[5]==='both'||a[5]===per),dn=L.filter(a=>ACOUNT(ds,a)>=a[4]).length;
  let h=`<section class="card"><div class="seg"><button class="${per==='am'?'on':''}" data-a="per" data-p="am">🌅 الصباح</button><button class="${per==='pm'?'on':''}" data-a="per" data-p="pm">🌇 المساء</button></div><p class="mute">أنجزت ${dn} من ${L.length} ذكرًا اليوم.</p><div class="bar lg"><i style="width:${Math.round(dn*100/L.length)}%"></i></div></section>`;
  for(const g of [...new Set(L.map(a=>a[1]))])
    h+=`<section class="card"><h2>${g}</h2>`+L.filter(a=>a[1]===g).map(a=>{const c=ACOUNT(ds,a),f=c>=a[4];return `<div class="ad ${f?'fin':''}"><div class="adh"><b>${a[2]}</b><span class="pill ${f?'ok':''}">${c}/${a[4]}</span></div><p class="adt">${a[3]}</p><div class="add"><button class="big" data-a="cnt" data-i="${a[0]}">${f?'✅ تم':'اضغط للعد'}</button><button class="x" data-a="unc" data-i="${a[0]}">تراجع</button></div></div>`}).join('')+`</section>`;
  return h;
}
let page=(location.hash||'#today').slice(1);
const PAGES=[['today','📋','اليوم'],['adhkar','🤲','الأذكار'],['add','➕','إضافة'],['sched','📅','الجدول'],['days','🗂','السجل'],['set','⚙️','الإعدادات']];
function render(){
  const now=new Date(),up=[...matches].filter(k=>k>Date.now()-2*3600e3).sort((a,b)=>a-b).slice(0,8);
  if(!PAGES.some(x=>x[0]===page))page='today';
  const S={
  adhkar:adhkarHtml(),
  today:`<section class="card">${active
    ?'<p><b>✅ المنبهات مفعّلة.</b> <span class="mute">أبقِ الصفحة مفتوحة والشاشة تعمل.</span></p>'
    :'<button class="big" style="margin-top:0" data-a="enable">فعّل المنبهات</button><p class="mute">اضغط الزر في كل مرة تفتح فيها الصفحة، ليسمح المتصفح بالصوت والإشعارات.</p>'}</section>
  <section class="card" id="miss" hidden></section>
  <section class="card"><h2>مهام اليوم</h2><div id="today"></div></section>`,
  add:`<section class="card"><h2>مهمة جديدة</h2>
    <div class="add"><input type="text" id="nt" placeholder="اكتب المهمة"></div>
    <h3>أيام التكرار وأوقاتها</h3>
    <p class="mute">اختر الأيام التي تتكرر فيها المهمة، وحدّد لكل يوم وقتًا إن أردت. الوقت اختياري.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th></th><th>اليوم</th><th>الوقت</th></tr></thead><tbody>${[6,0,1,2,3,4,5].map(i=>{const n=AR[i];return `<tr><td class="ck"><input type="checkbox" data-wd="${i}" aria-label="${n}"></td><td>${n}</td><td><input type="time" id="wt${i}" aria-label="وقت ${n}"></td></tr>`}).join('')}</tbody></table></div>
    <div class="add"><button class="x" data-a="alld">كل الأيام</button><button class="x" data-a="nod">مسح الاختيار</button></div>
    <h3>أو لمرة واحدة</h3>
    <p class="mute">إن لم تختر أي يوم، تُنفَّذ المهمة مرة واحدة في هذا التاريخ وهذا الوقت. وإن اخترتَ أيامًا فالتاريخ هو بداية التكرار.</p>
    <div class="add"><input type="date" id="ntd" value="${dstr(now)}" aria-label="التاريخ"><input type="time" id="ntt" aria-label="الوقت"></div>
    <button class="big" data-a="addt">إضافة المهمة</button></section>
  <section class="card"><h2>المهام المتكررة</h2><div id="rec"></div></section>
  <section class="card"><h2>مهام قادمة</h2><div id="up"></div></section>`,
  sched:`<section class="card"><h2>جدول المواد</h2><div class="scroll"><table class="tbl"><thead><tr><th>اليوم</th><th>الوقت</th><th>المادة</th></tr></thead><tbody>${COURSES.slice().sort((a,b)=>(a[1]+1)%7-(b[1]+1)%7||a[2]-b[2]).map(([c,wd,s,e])=>`<tr class="${wd===now.getDay()?'next':''}"><td>${AR[wd]}</td><td class="tm">${s}–${e}</td><td>${c}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>مباريات ريال مدريد</h2><p class="mute">الأوقات بتوقيت جهازك. الكتابة والورد يُرتَّبان قبل المباراة أو بعدها، قبل منتصف الليل.</p>
  ${up.length?`<div class="scroll"><table class="tbl"><thead><tr><th>اليوم</th><th>الموعد</th><th></th></tr></thead><tbody>${up.map(k=>{const d=new Date(k);return `<tr><td>${AR[d.getDay()]}</td><td class="tm">${d.getDate()}/${d.getMonth()+1}  ${hm(d)}</td><td><button class="x" data-a="delm" data-k="${k}" aria-label="حذف المباراة">حذف</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="mute">لا مباريات مسجلة.</p>'}
  <div class="add"><input type="datetime-local" id="newm"><button class="x" data-a="addm">إضافة</button></div></section>`,
  days:`<section class="card"><h2>تقرير الأسبوع</h2><div id="wk"></div></section>
  <section class="card"><h2>الأيام السابقة</h2><p class="mute">كل يوم ينتهي تُطوى صفحته وتصير للقراءة فقط، ويظهر فيها ما فاتك.</p><div id="arch"></div></section>`,
  set:`<section class="card"><h2>أنواع التنبيهات</h2><p class="mute">اضغط على النوع لتغييره: منبه ناطق، ثم إشعار فقط، ثم متوقف.</p>
  <div class="scroll"><table class="tbl"><thead><tr><th>البند</th><th>النوع</th></tr></thead><tbody>${CATS.map(([k,l])=>`<tr><td>${l}</td><td><button class="pb" data-a="mode" data-k="${k}">${MODES[mode(k)]}</button></td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>الأوقات</h2><div class="scroll"><table class="tbl"><thead><tr><th>الإعداد</th><th>الوقت</th></tr></thead><tbody>${[['morning','أذكار الصباح'],['evening','أذكار المساء'],['weekEnd','تذكير نهاية الأسبوع (الخميس)'],['weekStart','تذكير بداية الأسبوع (السبت)'],['sleepS','بداية النوم'],['sleepE','نهاية النوم']].map(([f,l])=>`<tr><td>${l}</td><td><input type="time" data-f="${f}" value="${cfg[f]}"></td></tr>`).join('')}</tbody></table></div></section>`};
  $('#app').innerHTML=`<header><h1>مواعيدي</h1><p class="mute">${fmt(now)}</p></header>${S[page]}`;
  $('#nav').innerHTML=PAGES.map(([k,i,l])=>`<a href="#${k}" class="${k===page?'on':''}"><span>${i}</span>${l}</a>`).join('');
  renderToday();renderOther();
}
window.addEventListener('hashchange',()=>{page=(location.hash||'#today').slice(1);render();scrollTo(0,0)});
document.addEventListener('click',e=>{
  const t=e.target.closest('.toast');if(t){t.remove();return}
  const b=e.target.closest('button[data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,id=b.dataset.id;
  if(a==='enable')enable();
  else if(a==='mode'){cfg.modes[k]=(mode(k)+1)%3;save();render()}
  else if(a==='delm'){matches=matches.filter(x=>x!==+k);save();render()}
  else if(a==='addm'){const v=$('#newm').value;if(!v)return;matches.push(new Date(v).getTime());save();render()}
  else if(a==='addt'){const ti=$('#nt').value.trim();if(!ti)return;
    const wd={};document.querySelectorAll('input[data-wd]').forEach(c=>{if(c.checked)wd[c.dataset.wd]=$('#wt'+c.dataset.wd).value||''});
    const has=Object.keys(wd).length>0;
    tasks.push({id:Date.now(),title:ti,date:$('#ntd').value||dstr(new Date()),time:has?'':$('#ntt').value,rep:false,wd:has?wd:null});
    save();render();toast('✅ أُضيفت المهمة',1)}
  else if(a==='per'){per=b.dataset.p;render()}
  else if(a==='openA'){per=b.dataset.p;location.hash='#adhkar'}
  else if(a==='cnt'||a==='unc'){
    const ds=dstr(new Date()),k='A'+per+b.dataset.i,it=ADHKAR.find(x=>String(x[0])===b.dataset.i),l=(log[ds]=log[ds]||{});
    l[k]=Math.max(0,Math.min(it[4],(l[k]||0)+(a==='cnt'?1:-1)));
    const L=ADHKAR.filter(x=>x[5]==='both'||x[5]===per),all=L.every(x=>(l['A'+per+x[0]]||0)>=x[4]);
    if(all)l[per==='am'?'M':'E']=1;else if(a==='unc')l[per==='am'?'M':'E']=0;
    save();render()}
  else if(a==='alld')document.querySelectorAll('input[data-wd]').forEach(c=>c.checked=true);
  else if(a==='nod')document.querySelectorAll('input[data-wd]').forEach(c=>c.checked=false)
  else if(a==='delt'){tasks=tasks.filter(x=>String(x.id)!==id);save();render()}
  else if(a==='mv'){const o=tasks.find(x=>String(x.id)===id);
    if(o&&!o.moved){o.moved=1;tasks.push({id:Date.now(),title:o.title,date:dstr(new Date()),time:o.time,rep:false});save();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){if(t.value){cfg[t.dataset.f]=t.value;save();renderToday()}}
  else if(t.dataset.a==='tick'){const dn=dstr(new Date());(log[dn]=log[dn]||{})[t.dataset.dk]=t.checked?1:0;save();renderToday()}
});
let curDay=dstr(new Date());
render();tick();setInterval(tick,5000);
setInterval(()=>{const n=dstr(new Date());if(n!==curDay){curDay=n;render()}else renderToday()},30000);
</script>
</body>
</html>
